<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 144" width="160" height="144">
  <!-- Schatten der untersten Papierebene, weich und abgesetzt -->
  <ellipse cx="78" cy="136" rx="62" ry="8" fill="#7A9549"/>
  <ellipse cx="79" cy="134.5" rx="59" ry="7" fill="#8FAB58"/>

  <!-- Werkstathalle: Papierzylinder, dunkle Mantelfläche und helle Lichtseite -->
  <path fill="#C89B6C" d="M 24 132 L 24 72 Q 24 68 28 68 L 132 68 Q 136 68 136 72 L 136 132 Q 136 136 132 136 L 28 136 Q 24 136 24 132 Z"/>
  <path fill="#D9B183" d="M 24 132 L 24 72 Q 24 68 28 68 L 62 68 Q 60 80 60 96 Q 60 114 62 132 Q 62 136 66 136 L 28 136 Q 24 136 24 132 Z"/>

  <!-- Flaches Papier-Pultdach: dunkle Unterschicht, helle Deckfläche, helle Trauflinie -->
  <path fill="#A0522D" d="M 14 78 L 22 78 L 82 44 L 142 78 L 134 82 L 22 82 Z"/>
  <path fill="#C97B4A" d="M 16 76 L 80 42 L 144 76 L 140 78 L 80 46 L 20 78 Z"/>
  <path fill="none" stroke="#E0995C" stroke-width="2" stroke-linecap="round" d="M 22 76 L 80 44"/>

  <!-- Tor: Papier-Rechteck mit heller Fuge -->
  <path fill="#6D4A31" d="M 60 136 L 60 100 Q 60 96 64 96 L 96 96 Q 100 96 100 100 L 100 136 Z"/>
  <path fill="#A87F52" d="M 64 136 L 64 102 L 96 102 L 96 136 Z"/>
  <path fill="#D9B183" d="M 64 102 L 96 102 L 96 106 L 64 106 Z"/>
  <circle cx="92" cy="118" r="2.4" fill="#5C4028"/>

  <!-- Fenster: Papier-Rechteck mit heller Lichtecke -->
  <path fill="#6D4A31" d="M 32 104 L 32 88 Q 32 84 36 84 L 52 84 Q 56 84 56 88 L 56 104 Z"/>
  <path fill="#F6F1E4" d="M 36 100 L 36 89 Q 36 88 37 88 L 46 88 L 46 100 Z"/>
  <path fill="#FDF9EC" d="M 38 96 L 38 89.5 Q 38 89 39 89 L 43 89 L 43 96 Z"/>

  <!-- Schornstein aus drei Papierschichten -->
  <path fill="#6E675D" d="M 112 48 L 112 30 L 126 30 L 126 48 Z"/>
  <path fill="#9A9287" d="M 112 46 L 112 30 L 115 30 L 115 46 Z"/>
  <path fill="#CFC9BE" d="M 110 29 L 114 25 L 124 25 L 128 29 Q 128 31 126 31 L 112 31 Q 110 31 110 29 Z"/>

  <!-- Geschnittenes Papierstück am Dach: hell geschnittener Schindelrand -->
  <path fill="none" stroke="#E0995C" stroke-width="2" stroke-linecap="round" d="M 104 62 L 118 70"/>

  <!-- Abgestellter Stamm: zweite Papierebene vor der Halle -->
  <g transform="rotate(-8 42 122)">
    <rect x="20" y="116" width="34" height="11" rx="5.5" fill="#8B5A2B"/>
    <rect x="20" y="116" width="34" height="3.6" rx="1.8" fill="#A5713C"/>
    <ellipse cx="54" cy="121.5" rx="3.4" ry="5.5" fill="#E8D9A8" stroke="#4A4237" stroke-width="1.4"/>
  </g>

  <!-- Werkzeugplan auf der Wand: Papier-Rechteck mit axialer Zahnkante -->
  <g transform="rotate(38 118 106)">
    <rect x="112" y="102" width="12" height="3.4" rx="1.7" fill="#C9C2B4"/>
    <rect x="112" y="100.4" width="12" height="1.4" rx="0.7" fill="#E8E0D0"/>
  </g>
</svg>
