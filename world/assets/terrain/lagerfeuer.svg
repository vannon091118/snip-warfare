    <path d="M 64 94 C 50 78 46 60 64 32 C 82 60 78 78 64 94 Z"/>
  </g>
  <g fill="#FFC93A">
    <path d="M 64 86 C 57 74 55 64 64 48 C 73 64 71 74 64 86 Z"/>
  </g>
  <g fill="#FFF2B8">
    <path d="M 64 80 C 60 72 60 66 64 57 C 68 66 68 72 64 80 Z"/>
