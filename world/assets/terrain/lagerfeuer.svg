    <ellipse cx="38" cy="106" rx="10" ry="6" transform="rotate(-18 38 106)"/>
    <ellipse cx="90" cy="106" rx="10" ry="6" transform="rotate(18 90 106)"/>
    <ellipse cx="64" cy="110" rx="34" ry="10"/>
  </g>
  <path fill="#8A6240" d="M 30 108 Q 34 103 42 104 Q 46 105 45 110 Q 40 113 32 112 Z"/>
  <path fill="#8A6240" d="M 98 108 Q 94 103 86 104 Q 82 105 83 110 Q 88 113 96 112 Z"/>
  <ellipse cx="38" cy="106" rx="4" ry="2.6" transform="rotate(-18 38 106)" fill="#C89B6C"/>
  <ellipse cx="90" cy="106" rx="4" ry="2.6" transform="rotate(18 90 106)" fill="#C89B6C"/>

  <!-- Flamme: drei gestapelte Papierschichten, Licht oben -->
