<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64">
  <!-- Holzhacken: Vier-Schlag-Zyklus, Füße stehen in jedem Frame an denselben Punkten -->
  <!-- Frame 1: Ausholen, Axt hinter dem Rücken hoch -->
  <g transform="translate(0 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 26 20 L 24 38"/>
      <path d="M 24 38 L 27 49 L 26 58"/>
      <path d="M 24 38 L 21 49 L 22 58"/>
      <path d="M 26 22 L 20 14"/>
      <path d="M 26 22 L 32 30"/>
    </g>
    <path d="M 20 14 L 13 7" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 12 9 C 8 4 15 1 20 4 L 15 10 Z" fill="#C9C2B4" stroke="#4A4237" stroke-width="1.6"/>
    <circle cx="26" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <rect x="22" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
  </g>

  <!-- Frame 2: Schlag bringt die Axt über den Kopf nach vorn -->
  <g transform="translate(64 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 26 20 L 24 38"/>
      <path d="M 24 38 L 27 49 L 26 58"/>
      <path d="M 24 38 L 21 49 L 22 58"/>
      <path d="M 26 22 L 33 14"/>
      <path d="M 26 22 L 31 30"/>
    </g>
    <path d="M 33 14 L 41 7" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 42 9 C 47 4 50 11 45 16 L 38 10 Z" fill="#C9C2B4" stroke="#4A4237" stroke-width="1.6"/>
    <circle cx="26" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <rect x="22" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
  </g>

  <!-- Frame 3: Treffer, Axt tief vor dem Körper -->
  <g transform="translate(128 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 26 20 L 24 38"/>
      <path d="M 24 38 L 27 49 L 26 58"/>
      <path d="M 24 38 L 21 49 L 22 58"/>
      <path d="M 26 22 L 34 28"/>
      <path d="M 26 22 L 31 31"/>
    </g>
    <path d="M 34 28 L 43 34" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 44 32 C 50 30 51 38 44 39 L 39 33 Z" fill="#C9C2B4" stroke="#4A4237" stroke-width="1.6"/>
    <path d="M 44 40 L 49 38 M 45 44 L 50 43" stroke="#4A4237" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <rect x="22" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
  </g>

  <!-- Frame 4: Nachfedern, Axt wird wieder angehoben -->
  <g transform="translate(192 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 26 20 L 24 38"/>
      <path d="M 24 38 L 27 49 L 26 58"/>
      <path d="M 24 38 L 21 49 L 22 58"/>
      <path d="M 26 22 L 30 22"/>
      <path d="M 26 22 L 32 30"/>
    </g>
    <path d="M 30 22 L 37 18" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 38 20 C 43 15 46 22 41 26 L 34 21 Z" fill="#C9C2B4" stroke="#4A4237" stroke-width="1.6"/>
    <circle cx="26" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <rect x="22" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
  </g>
</svg>
