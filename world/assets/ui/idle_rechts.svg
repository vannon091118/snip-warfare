<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 64" width="192" height="64">
  <!-- Idle: Atmung und leichtes Wiegen, Füße bleiben in jedem Frame an derselben Stelle -->
  <!-- Frame 1: Grundhaltung -->
  <g transform="translate(0 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 24 20 L 24 38"/>
      <path d="M 24 38 L 27 49 L 26 58"/>
      <path d="M 24 38 L 21 49 L 22 58"/>
      <path d="M 24 24 L 27 33 L 29 41"/>
      <path d="M 24 24 L 21 33 L 19 41"/>
    </g>
    <circle cx="24" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <path d="M 20 21 C 15 20 12 22 10 26" fill="none" stroke="#C75B39" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
  </g>

  <!-- Frame 2: Einatmen, Oberkörper hebt sich minimal -->
  <g transform="translate(48 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g transform="translate(0 -1)">
      <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M 24 20 L 24 38"/>
        <path d="M 24 38 L 27 49 L 26 58"/>
        <path d="M 24 38 L 21 49 L 22 58"/>
        <path d="M 24 24 L 27 33 L 29 41"/>
        <path d="M 24 24 L 21 33 L 19 41"/>
      </g>
      <circle cx="24" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
      <path d="M 20 21 C 15 19 12 21 10 25" fill="none" stroke="#C75B39" stroke-width="3" stroke-linecap="round"/>
      <rect x="20" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
    </g>
  </g>

  <!-- Frame 3: Grundhaltung, Arm leicht ausgestellt -->
  <g transform="translate(96 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 24 20 L 24 38"/>
      <path d="M 24 38 L 27 49 L 26 58"/>
      <path d="M 24 38 L 21 49 L 22 58"/>
      <path d="M 24 24 L 29 32 L 33 40"/>
      <path d="M 24 24 L 19 33 L 16 41"/>
    </g>
    <circle cx="24" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <path d="M 20 21 C 15 20 12 22 10 26" fill="none" stroke="#C75B39" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
  </g>

  <!-- Frame 4: Ausatmen, Oberkörper senkt sich minimal -->
  <g transform="translate(144 0)">
    <ellipse cx="24" cy="60" rx="12" ry="3" fill="#7A9549"/>
    <ellipse cx="25" cy="59" rx="10" ry="2.4" fill="#8FAB58"/>
    <g transform="translate(0 1)">
      <g stroke="#4A4237" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M 24 20 L 24 38"/>
        <path d="M 24 38 L 27 49 L 26 58"/>
        <path d="M 24 38 L 21 49 L 22 58"/>
        <path d="M 24 24 L 27 33 L 29 41"/>
        <path d="M 24 24 L 21 33 L 19 41"/>
      </g>
      <circle cx="24" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
      <path d="M 20 21 C 15 21 12 23 10 27" fill="none" stroke="#C75B39" stroke-width="3" stroke-linecap="round"/>
      <rect x="20" y="19" width="11" height="4" rx="2" fill="#C75B39"/>
    </g>
  </g>
</svg>
