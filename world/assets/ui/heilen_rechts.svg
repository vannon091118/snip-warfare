    <circle cx="24" cy="13" r="6.5" fill="#FBF6E8" stroke="#4A4237" stroke-width="3"/>
    <path d="M 20 21 C 15 20 12 22 10 26" fill="none" stroke="#C75B39" stroke-width="3" stroke-linecap="round"/>
