<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <!-- Vogel: Flügelschlag in 4 Frames, Flugrichtung rechts -->
  <!-- Frame 1: Flügel oben -->
  <g transform="translate(0 0)">
    <ellipse cx="16" cy="34" rx="10" ry="6.4" fill="#8A6240"/>
    <ellipse cx="15" cy="33" rx="8" ry="5" fill="#A87F52"/>
    <circle cx="25" cy="28" r="5.4" fill="#8A6240"/>
