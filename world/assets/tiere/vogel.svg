    <ellipse cx="12.4" cy="11" rx="2.6" ry="7" fill="#A87F52" transform="rotate(-40 12.4 11)"/>
    <path d="M 5 30 Q 10 26 14 28 L 13 34 Q 8 35 5 30 Z" fill="#6D4A31"/>
  </g>
