    <path d="M 5 38 Q 10 34 14 36 L 13 42 Q 8 43 5 38 Z" fill="#6D4A31"/>
  </g>

  <!-- Frame 4: Aufsteigen, Flügel oben, Kopf nach vorn oben -->
  <g transform="translate(96 0)">
    <ellipse cx="16" cy="28" rx="10" ry="6.4" fill="#8A6240" transform="rotate(-16 16 28)"/>
    <ellipse cx="15" cy="27" rx="8" ry="5" fill="#A87F52" transform="rotate(-16 15 27)"/>
