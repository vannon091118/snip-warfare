    <ellipse cx="14" cy="18" rx="4" ry="10" fill="#6D4A31" transform="rotate(-28 14 18)"/>
    <ellipse cx="13.4" cy="17" rx="2.6" ry="7" fill="#A87F52" transform="rotate(-28 13.4 17)"/>
    <path d="M 5 36 Q 10 32 14 34 L 13 40 Q 8 41 5 36 Z" fill="#6D4A31"/>
  </g>

  <!-- Frame 2: Flügel in der Mitte -->
  <g transform="translate(32 0)">
