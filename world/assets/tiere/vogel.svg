    <circle cx="25.6" cy="27.4" r="1.3" fill="#4A3220"/>
    <ellipse cx="15" cy="20" rx="4" ry="9" fill="#6D4A31" transform="rotate(-6 15 20)"/>
    <ellipse cx="14.4" cy="19" rx="2.6" ry="6" fill="#A87F52" transform="rotate(-6 14.4 19)"/>
    <path d="M 5 34 Q 10 31 14 33 L 13 39 Q 8 40 5 34 Z" fill="#6D4A31"/>
  </g>

  <!-- Frame 3: Flügel unten, Körper leicht gesenkt -->
  <g transform="translate(64 0)">
    <ellipse cx="16" cy="36" rx="10" ry="6.4" fill="#8A6240"/>
    <ellipse cx="15" cy="35" rx="8" ry="5" fill="#A87F52"/>
    <circle cx="25" cy="31" r="5.4" fill="#8A6240"/>
    <circle cx="24" cy="30" r="4.4" fill="#A87F52"/>
