    <ellipse cx="24" cy="32" rx="2.6" ry="10" fill="#B5AEA1" transform="rotate(2 24 32)"/>
    <ellipse cx="23.6" cy="32" rx="1.8" ry="8" fill="#CFC9BE" transform="rotate(2 23.6 32)"/>
    <ellipse cx="31" cy="35" rx="2.4" ry="8" fill="#B5AEA1" transform="rotate(14 31 35)"/>
    <circle cx="30" cy="43.4" r="1.5" fill="#4A4237"/>
    <ellipse cx="31.6" cy="46.4" rx="2.2" ry="1.8" fill="#8B8478"/>
  </g>
</svg>
