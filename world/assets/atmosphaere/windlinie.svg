    <path d="M 6 10 C 22 4 42 5 58 9 C 70 12 82 11 90 8" stroke-width="2.6"/>
    <path d="M 6 17 C 26 12 48 13 66 17 C 76 19.5 84 19 90 17" stroke-width="2" opacity="0.8"/>
    <path d="M 6 24 C 24 20 44 21 60 24 C 72 26 82 25.5 90 23.5" stroke-width="1.6" opacity="0.6"/>
  </g>
